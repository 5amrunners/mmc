<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5AM Runners – Monthly Mileage Challenge</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#1f2430;--mu:#6b7280;--ac:#e8590c;--ok:#2f9e44;--bd:#e8e2d8;--tr:#eee8de}
@media(prefers-color-scheme:dark){:root{--bg:#15171c;--card:#1f232b;--tx:#eef0f4;--mu:#9aa3b2;--bd:#2f3541;--tr:#2b303a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:22px 0 8px}
.sub{color:var(--mu);font-size:13px}
.nav{display:flex;gap:8px;align-items:center;margin:12px 0}.nav b{flex:1;text-align:center;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mu)}
.award{display:flex;gap:10px;align-items:center;margin-bottom:8px}.award .e{font-size:24px}
.row{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rk{color:var(--mu);width:26px;display:inline-block}.nm{font-weight:600}
.km{font-variant-numeric:tabular-nums;font-size:14px}
.bar{height:8px;background:var(--tr);border-radius:99px;margin:8px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px}.bar i.d{background:var(--ok)}
.act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
input,button,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px}
input[type=number]{width:90px}input.w{flex:1;min-width:120px}
button{cursor:pointer;background:var(--ac);color:#fff;border:0}
button.g{background:transparent;color:var(--mu);border:1px solid var(--bd)}
.ed{display:none;margin-top:8px}.ed.on{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
textarea{width:100%;height:200px;font-size:13px}
.badge{font-size:12px;color:var(--ok);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--bd)}
tr.h{cursor:pointer}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:99px;display:none;font-size:13px}
</style>
</head>
<body>
<main>
  <h1>🏃 5AM Runners – Monthly Mileage Challenge</h1>
  <div class="sub">Track in Strava · log your kms here · everyone sees live totals</div>
  <div id="setup" class="card" style="display:none;margin-top:12px">Add your Supabase URL and key at the top of the script in this file (see setup steps).</div>
  <div class="nav"><button class="g" onclick="shift(-1)">◀</button><b id="ml"></b><button class="g" onclick="shift(1)">▶</button></div>
  <div class="grid" id="stats"></div>
  <div class="card" id="awards"></div>
  <h2>Leaderboard</h2>
  <div id="list"></div>
  <div class="act" id="copyrow" style="display:none"><button class="g" onclick="copyPrev()">Start this month: copy runners &amp; targets from last month</button></div>
  <h2>Join / add runner</h2>
  <div class="act"><input class="w" id="an" placeholder="Name"><input type="number" id="at" placeholder="Target km" min="1"><button onclick="addRunner()">Add</button></div>
  <h2>WhatsApp message</h2>
  <textarea id="msg" readonly></textarea>
  <div class="act" style="margin-top:8px"><button id="cp" onclick="copyMsg()">Copy message</button></div>
  <h2>Month history</h2>
  <div class="card" style="padding:6px 10px"><table id="hist"></table></div>
</main>
<div id="toast"></div>
<script>
var SB_URL="https://dwdediridaxulihelhpp.supabase.co",SB_KEY="sb_publishable_e5zdZRXtLAPPJ4mmC41cYw_n0aZYdXS";
var M=ym(new Date()),R=[],ALL=[];
function ym(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function lbl(m){var p=m.split("-");return new Date(p[0],p[1]-1,1).toLocaleString("en",{month:"long",year:"numeric"})}
function shift(n){var p=M.split("-");M=ym(new Date(p[0],p[1]-1+n,1));load()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function f(n){return Math.round(n*100)/100}
function pct(x){return x.km/x.target*100}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(function(){e.style.display="none"},2500)}
function api(p,o){o=o||{};return fetch(SB_URL+"/rest/v1/"+p,{method:o.method||"GET",body:o.body?JSON.stringify(o.body):undefined,headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json",Prefer:o.prefer||"return=minimal"}}).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error(t)});return r.text().then(function(t){return t?JSON.parse(t):null})})}
function err(e){toast(/duplicate|23505/.test(e.message)?"That runner already exists this month":"Something went wrong, try again")}
function load(){
  if(SB_URL.indexOf("PASTE")==0){document.getElementById("setup").style.display="block";return}
  document.getElementById("ml").textContent=lbl(M);
  Promise.all([api("runners?month=eq."+M+"&select=*"),api("runners?select=month,name,km,target")]).then(function(a){R=a[0]||[];ALL=a[1]||[];render()}).catch(err)
}
function render(){
  var r=R.slice().sort(function(a,b){return b.km-a.km}),tot=0,ach=0;
  r.forEach(function(x){tot+=+x.km;if(x.km>=x.target)ach++});
  document.getElementById("stats").innerHTML=[[r.length,"Runners"],[f(tot)+" km","Total distance"],[ach,"Target achievers"]].map(function(s){return '<div class="card stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>'}).join("");
  var mp=R.slice().sort(function(a,b){return pct(b)-pct(a)})[0];
  document.getElementById("awards").innerHTML=r.length?'<div class="award"><span class="e">🥇</span><div><b>Most kilometres</b><br>'+esc(r[0].name)+' – '+f(r[0].km)+' km</div></div><div class="award" style="margin:0"><span class="e">🎯</span><div><b>Highest % of target</b><br>'+esc(mp.name)+' – '+Math.round(pct(mp))+'%</div></div>':"No runners yet this month";
  document.getElementById("copyrow").style.display=r.length?"none":"flex";
  document.getElementById("list").innerHTML=r.map(function(x,i){var p=pct(x),d=x.km>=x.target;
    return '<div class="row"><div class="top"><span><span class="rk">'+(i+1)+'</span><span class="nm">'+esc(x.name)+'</span> '+(d?'<span class="badge">✅ Achieved</span>':'')+'</span><span class="km">'+f(x.km)+' / '+f(x.target)+' km · '+Math.round(p)+'%</span></div><div class="bar"><i class="'+(d?'d':'')+'" style="width:'+Math.min(p,100)+'%"></i></div>'+
    '<div class="act"><input type="number" step="0.01" min="0" placeholder="+ km" id="a'+x.id+'"><button onclick="addKm('+x.id+')">Add run</button><button class="g" onclick="tog('+x.id+')">Edit</button></div>'+
    '<div class="ed" id="e'+x.id+'"><label class="sub">Total <input type="number" step="0.01" id="k'+x.id+'" value="'+x.km+'"></label><label class="sub">Target <input type="number" id="t'+x.id+'" value="'+x.target+'"></label><button onclick="save('+x.id+')">Save</button><button class="g" onclick="del('+x.id+')">Remove (admin)</button></div></div>'}).join("");
  var L=["🏃‍♂️ *5AM Runners – MMC "+lbl(M)+"* 🏃‍♀️",""],m=["🥇","🥈","🥉"];
  r.forEach(function(x,i){L.push((m[i]||(i+1)+".")+" "+x.name+" – "+f(x.km)+"/"+f(x.target)+(x.km>=x.target?" ✅":""))});
  L.push("","Total: "+f(tot)+" km · Achievers: "+ach+"/"+r.length,"Every kilometre counts! 💛 Team 5AM Runners");
  document.getElementById("msg").value=L.join("\n");
  var H={};ALL.forEach(function(x){var h=H[x.month]||(H[x.month]={n:0,t:0,a:0,top:null});h.n++;h.t+=+x.km;if(x.km>=x.target)h.a++;if(!h.top||x.km>h.top.km)h.top=x});
  document.getElementById("hist").innerHTML='<tr><th>Month</th><th>Runners</th><th>Total km</th><th>Achievers</th><th>Top</th></tr>'+Object.keys(H).sort().reverse().map(function(k){var h=H[k];return '<tr class="h" onclick="M=\''+k+'\';load();scrollTo(0,0)"><td>'+lbl(k)+'</td><td>'+h.n+'</td><td>'+f(h.t)+'</td><td>'+h.a+'</td><td>'+esc(h.top.name)+'</td></tr>'}).join("");
}
function tog(id){document.getElementById("e"+id).classList.toggle("on")}
function addKm(id){var v=parseFloat(document.getElementById("a"+id).value);if(!(v>0))return;api("rpc/add_km",{method:"POST",body:{p_id:id,p_km:v}}).then(load).catch(err)}
function save(id){var k=parseFloat(document.getElementById("k"+id).value),t=parseFloat(document.getElementById("t"+id).value);if(isNaN(k)||k<0||!(t>0))return toast("Check the numbers");api("runners?id=eq."+id,{method:"PATCH",body:{km:k,target:t}}).then(load).catch(err)}
function addRunner(){var n=document.getElementById("an").value.trim(),t=parseFloat(document.getElementById("at").value);if(!n||!(t>0))return toast("Enter name and target");api("runners",{method:"POST",body:{month:M,name:n,target:t,km:0}}).then(function(){document.getElementById("an").value="";document.getElementById("at").value="";load()}).catch(err)}
function del(id){var p=prompt("Admin PIN to remove this runner:");if(!p)return;api("rpc/delete_runner",{method:"POST",prefer:"return=representation",body:{p_id:id,p_pin:p}}).then(function(ok){toast(ok?"Removed":"Wrong PIN");load()}).catch(err)}
function copyPrev(){var p=M.split("-"),pm=ym(new Date(p[0],p[1]-2,1));api("runners?month=eq."+pm+"&select=name,target",{prefer:"return=representation"}).then(function(a){if(!a.length)return toast("No runners last month");return api("runners?on_conflict=month,name",{method:"POST",prefer:"resolution=ignore-duplicates,return=minimal",body:a.map(function(x){return{month:M,name:x.name,target:x.target,km:0}})}).then(load)}).catch(err)}
function copyMsg(){var t=document.getElementById("msg");t.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}if(!ok&&navigator.clipboard){navigator.clipboard.writeText(t.value);ok=true}toast(ok?"Copied ✓":"Select and copy")}
load();setInterval(function(){if(!document.hidden&&!document.activeElement.matches("input"))load()},20000);
</script>
</body>
</html>
